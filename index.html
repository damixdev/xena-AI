<!DOCTYPE html>

}

<body>

<input id="text" placeholder="Scrie ceva...">
<button onclick="trimite()">Trimite</button>
</div>

<script>
function trimite(){
 let t=document.getElementById("text").value;
 document.getElementById("mesaj").innerHTML="Ai spus: "+t;
}
</script>

</body>
</html>
