<!DOCTYPE html>
<html>
<head>
<title>Xena AI</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 50px;
}

.box {
  background: #222;
  padding: 30px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
}

#chat {
  background: #333;
  padding: 15px;
  height: 200px;
  overflow-y: auto;
  border-radius: 10px;
  text-align: left;
  margin-bottom: 15px;
}

input {
  padding: 10px;
  width: 65%;
  border-radius: 8px;
  border: none;
}

button {
  background: #5865F2;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="box">

<h1>🤖 Xena AI</h1>

<div id="chat">
<p>Xena: Salut! Cu ce te pot ajuta?</p>
</div>

<input id="mesaj" placeholder="Scrie un mesaj...">

<button onclick="trimite()">Trimite</button>

</div>

<script>
function trimite() {

let mesaj = document.getElementById("mesaj").value;

if (mesaj == "") {
return;
}

document.getElementById("chat").innerHTML += 
"<p>Tu: " + mesaj + "</p>";

document.getElementById("chat").innerHTML += 
"<p>Xena: Am primit mesajul tău!</p>";

document.getElementById("mesaj").value = "";

}
</script>

</body>
</html>
