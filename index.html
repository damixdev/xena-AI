<!DOCTYPE html>
<html>
<head>
<title>Xena AI</title>
<style>
body {
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
}
.box {
  background:#222;
  padding:20px;
  border-radius:15px;
}
input,button {
  padding:10px;
  margin:5px;
}
#admin {
  display:none;
}
</style>
</head>

<body>

<div class="box">
<h1>🤖 Xena AI</h1>

<input id="mesaj" placeholder="Scrie mesajul">
<button onclick="trimite()">Trimite</button>

<p id="raspuns"></p>
</div>

<hr>

<button onclick="admin()">Admin Panel</button>

<div id="admin" class="box">
<h2>Administrator</h2>
<p>Status: Online ✅</p>
<p>Utilizatori: 1</p>
<button onclick="inchide()">Închide</button>
</div>


<script>
function trimite(){
let m=document.getElementById("mesaj").value;

document.getElementById("raspuns").innerHTML =
"Xena: Am primit: " + m;
}

function admin(){
let parola=prompt("Parola admin:");

if(parola=="xena123"){
document.getElementById("admin").style.display="block";
}
else{
alert("Parolă greșită");
}
}

function inchide(){
document.getElementById("admin").style.display="none";
}
</script>

</body>
</html>
