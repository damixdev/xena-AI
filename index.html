<!DOCTYPE html>
<html>
<head>
<title>Xena AI</title>
<style>
body {
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
}
.box {
  background:#222;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
input {
  width:80%;
  padding:10px;
  border-radius:10px;
  border:none;
}
button {
  padding:10px 20px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}
#chat {
  margin:20px;
}
</style>
</head>

<body>

<div class="box">
<h1>Xena AI</h1>

<div id="chat">
Salut! Sunt Xena AI 🤖
</div>

<input id="msg" placeholder="Scrie un mesaj...">
<br>
<button onclick="send()">Trimite</button>

</div>

<script>
function send(){
 let text=document.getElementById("msg").value;
 document.getElementById("chat").innerHTML += "<p>Tu: "+text+"</p>";
 document.getElementById("msg").value="";
}
</script>

</body>
</html>
