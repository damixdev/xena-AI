<!DOCTYPE html>
<html>
<head>
<title>Xena AI</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 40px;
}

.box {
  background: #222;
  padding: 25px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
}

input {
  width: 70%;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#chat {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">
<h1>🤖 Xena AI</h1>

<div id="chat">
<p>Xena: Salut! Sunt Xena AI. Cu ce te pot ajuta?</p>
</div>

<input id="msg" placeholder="Scrie un mesaj...">
<button onclick="send()">Trimite</button>

</div>

<script>
function send() {
  let text = document.getElementById("msg").value;
  let chat = document.getElementById("chat");

  chat.innerHTML += "<p>Tu: " + text + "</p>";

  let raspuns = "Nu am înțeles încă, dar învăț.";

  if(text.toLowerCase().includes("salut")) {
    raspuns = "Salut! Mă bucur să te văd.";
  }

  if(text.toLowerCase().includes("cine esti")) {
    raspuns = "Sunt Xena AI.";
  }

  chat.innerHTML += "<p>Xena: " + raspuns + "</p>";

  document.getElementById("msg").value = "";
}
</script>

</body>
</html>
